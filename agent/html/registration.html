<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>TPC: Client</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark">
    <div class="container">
        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
            <form id="form">
                <div class="card">
                    <div class="card-header">
                        Реєстрація
                    </div>
                    <div class="card-body">
                        <div class="row my-2">
                            <div class="col">
                                <div class="form-group">
                                    <label for="exampleInputEmail1">Клас</label>
                                    <select name="class_number" class="form-control form-control-sm">
                                        <option value="1" selected>1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                        <option value="9">9</option>
                                        <option value="10">10</option>
                                        <option value="11">11</option>
                                        <option value="12">12</option>
                                    </select>
                                </div>

                            </div>
                            <div class="col">
                                <div class="form-group">
                                    <label for="exampleInputEmail1">Літера</label>
                                    <select name="class_letter" class="form-control form-control-sm">
                                        <option value="А" selected>А</option>
                                        <option value="Б">Б</option>
                                        <option value="В">В</option>
                                        <option value="Г">Г</option>
                                        <option value="Д">Д</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <hr />
                        <div class="row my-2">
                            <div class="col">
                                <input name="u1_first_name" type="text" class="form-control" placeholder="Ім'я *"
                                    required>
                            </div>
                            <div class="col">
                                <input name="u1_last_name" type="text" class="form-control" placeholder="Прізвище *"
                                    required>
                            </div>
                        </div>
                        <hr />
                        <div class="row my-2">
                            <div class="col">
                                <input name="u2_first_name" type="text" class="form-control" placeholder="Ім'я">
                            </div>
                            <div class="col">
                                <input name="u2_last_name" type="text" class="form-control" placeholder="Прізвище">
                            </div>
                        </div>
                        <hr />
                        <div class="row my-2">
                            <div class="col">
                                <input name="u3_first_name" type="text" class="form-control" placeholder="Ім'я">
                            </div>
                            <div class="col">
                                <input name="u3_last_name" type="text" class="form-control" placeholder="Прізвище">
                            </div>
                        </div>
                        <hr />
                        <div class="row my-2">
                            <div class="col">
                                <input name="u4_first_name" type="text" class="form-control" placeholder="Ім'я">
                            </div>
                            <div class="col">
                                <input name="u4_last_name" type="text" class="form-control" placeholder="Прізвище">
                            </div>
                        </div>

                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary">Зареєструватись</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script>
        const form = document.getElementById('form');

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const result = {
                class: `${data.class_number}-${data.class_letter}`,
                users: [
                    { firstName: data.u1_first_name, lastName: data.u1_last_name },
                    { firstName: data.u2_first_name, lastName: data.u2_last_name },
                    { firstName: data.u3_first_name, lastName: data.u3_last_name },
                    { firstName: data.u4_first_name, lastName: data.u4_last_name },
                ].filter(r => r.firstName || r.lastName),
            }

            for (const user of result.users) {
                if (!user.firstName?.length || !user.lastName?.length) {
                    return;
                }
            }

            window.electronAPI.sendMessage({
                target: "server",
                type: "registration",
                data: result,
            });
            
            window.electronAPI.sendMessage({
                target: "self",
                type: "window/close",
            });
        })
    </script>
</body>
